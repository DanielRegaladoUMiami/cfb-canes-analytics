[project]
name = "cfb-canes-analytics"
version = "0.0.1"
description = "College football totals (over/under) model priced against Kalshi and Polymarket strike ladders, benchmarked to sportsbook closing lines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Regalado" }]
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.20",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.scripts]
cfb = "cfb_canes_analytics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfb_canes_analytics"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Belt and braces: import the package from src even if the editable .pth is not
# honoured (macOS can flag venv .pth files UF_HIDDEN, which Python 3.13 skips).
pythonpath = ["src", "."]
